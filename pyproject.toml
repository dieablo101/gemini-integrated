[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-integrated"
version = "1.0.0"
description = "Autonomous Bilateral Cognitive Operating System and Neural Development Environment"
readme = "README.md"
authors = [
    { name = "Kyle Gallagher" },
]
license = "MIT"
requires-python = ">=3.10"
keywords = ["gemini", "ai", "operating-system", "cognitive-os", "terminal", "textual", "graphics-engine", "distributed-systems", "pbr-pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]

dependencies = [
    "textual>=0.50.0",
    "google-genai>=1.0.0",
    "rich>=13.0.0",
    "pyperclip>=1.8.0",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build",
    "wheel",
    "twine",
]

[project.urls]
Homepage = "https://dieablo101.github.io/gemini-integrated/"
Documentation = "https://dieablo101.github.io/gemini-integrated/"
Observatory = "https://gemini-source.web.app"
Source = "https://github.com/dieablo101/gemini-integrated"
"Personal Profile" = "https://github.com/slaterbbx"

[project.scripts]
gemini-integrated = "gemini_app.main:main"
gemini = "gemini_app.main:main"
gemini-satellite = "gemini_app.fleet.satellite:main"
gemini-status = "gemini_app.task_runner:cli_main"
gemini-runner = "gemini_app.build_runner:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gemini_app*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]
